<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelato & Cia · Carrinho</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .carrinho-lista { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 1rem; }
    .item-carrinho {
      display: flex; align-items: center; gap: 1rem;
      background: rgba(255,250,245,0.85); padding: 1rem 1.2rem;
      border-radius: 32px; box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    .item-carrinho img, .item-carrinho .sem-img {
      width: 70px; height: 70px; border-radius: 20px; object-fit: cover;
      background: #ffe6d8; display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .item-info { flex: 1; }
    .item-info h4 { color: #3f2a1b; font-size: 1.2rem; }
    .item-info .preco { color: #b8653a; font-weight: 700; }
    .qtd-controle { display: flex; align-items: center; gap: 0.5rem; }
    .qtd-controle button {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: #ffe6d8; color: #b8653a; font-weight: 700; cursor: pointer;
      font-size: 1.1rem;
    }
    .qtd-controle span { min-width: 24px; text-align: center; font-weight: 700; }
    .btn-remover {
      background: transparent; border: none; color: #d67a5a; cursor: pointer; font-size: 1.2rem;
    }
    .total-carrinho {
      max-width: 800px; width: 100%; text-align: right; margin-top: 1rem;
      font-size: 1.5rem; font-weight: 700; color: #3f2a1b;
    }
    .total-carrinho span { color: #b8653a; }
    .acoes-carrinho { display: flex; gap: 1rem; justify-content: flex-end; max-width: 800px; width: 100%; margin-top: 1rem; flex-wrap: wrap; }
    .btn-secundario {
      background: transparent; border: 2px solid #d67a5a; color: #b8653a;
      padding: 0.9rem 1.5rem; border-radius: 60px; font-weight: 700; cursor: pointer;
      font-family: 'Quicksand', sans-serif;
    }
    .carrinho-vazio { text-align: center; color: #b28a78; padding: 3rem; }
  </style>
</head>
<body>
  <header class="header-full">
    <div class="logo-sorveteria">
      <i class="fas fa-ice-cream"></i>
      <h2>Gelato &amp; Cia</h2>
      <span>🍦</span>
    </div>
    <nav class="nav-links">
      <a href="produtos.html"><i class="fas fa-store"></i> Produtos</a>
      <a href="carrinho.html" class="active"><i class="fas fa-shopping-cart"></i> Carrinho</a>
      <a href="login.html"><i class="fas fa-user"></i> Login</a>
    </nav>
  </header>

  <main class="main-content" style="flex-direction: column; align-items: center;">
    <div class="form-title"><i class="fas fa-shopping-cart"></i> Seu Carrinho</div>

    <div class="carrinho-lista" id="carrinho-lista"></div>

    <div class="total-carrinho" id="total-carrinho" style="display:none;">
      Total: <span id="valor-total">R$ 0,00</span>
    </div>

    <div class="acoes-carrinho" id="acoes" style="display:none;">
      <button class="btn-secundario" onclick="limparCarrinho()">
        <i class="fas fa-trash"></i> Limpar
      </button>
      <button class="btn_enviar" onclick="finalizarCompra()" style="width:auto;">
        <i class="fas fa-check"></i> Finalizar Compra
      </button>
    </div>
  </main>

  <script>
    function obterCarrinho() {
      return JSON.parse(localStorage.getItem("carrinho") || "[]");
    }
    function salvarCarrinho(c) {
      localStorage.setItem("carrinho", JSON.stringify(c));
    }
    function formatarPreco(p) {
      return `R$ ${p.toFixed(2).replace('.', ',')}`;
    }

    function renderizar() {
      const carrinho = obterCarrinho();
      const lista = document.getElementById("carrinho-lista");
      const totalEl = document.getElementById("total-carrinho");
      const acoesEl = document.getElementById("acoes");

      if (carrinho.length === 0) {
        lista.innerHTML = `
          <div class="carrinho-vazio">
            <i class="fas fa-ice-cream" style="font-size:3rem; color:#d67a5a; display:block; margin-bottom:1rem;"></i>
            Seu carrinho está vazio 🍦<br>
            <a href="produtos.html" style="color:#b8653a; font-weight:700;">Ver produtos</a>
          </div>`;
        totalEl.style.display = "none";
        acoesEl.style.display = "none";
        return;
      }

      lista.innerHTML = carrinho.map(item => `
        <div class="item-carrinho">
          ${item.imagem
            ? `<img src="${item.imagem}" alt="${item.sabor}">`
            : `<div class="sem-img">🍨</div>`}
          <div class="item-info">
            <h4>${item.sabor}</h4>
            <div class="preco">${formatarPreco(item.preco)}</div>
          </div>
          <div class="qtd-controle">
            <button onclick="alterarQtd(${item.id}, -1)">−</button>
            <span>${item.quantidade}</span>
            <button onclick="alterarQtd(${item.id}, 1)">+</button>
          </div>
          <button class="btn-remover" onclick="removerItem(${item.id})">
            <i class="fas fa-times"></i>
          </button>
        </div>
      `).join('');

      const total = carrinho.reduce((acc, i) => acc + i.preco * i.quantidade, 0);
      document.getElementById("valor-total").textContent = formatarPreco(total);
      totalEl.style.display = "block";
      acoesEl.style.display = "flex";
    }

    function alterarQtd(id, delta) {
      const carrinho = obterCarrinho();
      const item = carrinho.find(i => i.id === id);
      if (!item) return;
      item.quantidade += delta;
      if (item.quantidade <= 0) {
        const idx = carrinho.indexOf(item);
        carrinho.splice(idx, 1);
      }
      salvarCarrinho(carrinho);
      renderizar();
    }

    function removerItem(id) {
      const carrinho = obterCarrinho().filter(i => i.id !== id);
      salvarCarrinho(carrinho);
      renderizar();
    }

    function limparCarrinho() {
      if (confirm("Limpar todo o carrinho?")) {
        salvarCarrinho([]);
        renderizar();
      }
    }

    async function finalizarCompra() {
      const token = localStorage.getItem("token");
      if (!token) {
        alert("Você precisa fazer login para finalizar a compra.");
        window.location.href = "login.html";
        return;
      }

      const carrinho = obterCarrinho();
      if (carrinho.length === 0) return;

      const pedido = {
        itens: carrinho.map(i => ({ produto_id: i.id, quantidade: i.quantidade, preco: i.preco })),
        total: carrinho.reduce((acc, i) => acc + i.preco * i.quantidade, 0)
      };

      try {
        const resposta = await fetch("http://localhost:3000/pedido", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(pedido)
        });

        if (!resposta.ok) throw new Error("Erro ao finalizar pedido");

        alert("🎉 Pedido realizado com sucesso!");
        salvarCarrinho([]);
        window.location.href = "produtos.html";
      } catch (erro) {
        alert("Erro ao finalizar: " + erro.message);
      }
    }

    renderizar();
  </script>
</body>
</html>
